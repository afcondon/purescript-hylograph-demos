workspace:
  packageSet:
    registry: 80.8.0
  extraPackages:
    # Not in any package set — unpublished. Built from the sibling checkout.
    hylograph-onion:
      path: ../purescript-hylograph-onion
    # Likewise unpublished: the layout-driven half of the chart library.
    hylograph-layout-components:
      path: ../purescript-hylograph-layout-components
    # Local, because the state-machine demo needs `Transition extra`, which is
    # newer than the published 0.3.0 that package set 80.8.0 carries. Keep
    # publish.version at 0.3.0 there until we actually publish, or every
    # sibling demo's `<0.4.0` range breaks.
    hylograph-layout:
      path: ../purescript-hylograph-layout
    # Local for the same reason, and it has to be pinned rather than left to the
    # registry: hylograph-layout above imports `Data.Graph.InducedTree`, which
    # post-dates hylograph-graph's v0.3.0 tag, so one consistent copy of
    # hylograph-graph has to be in the build.
    hylograph-graph:
      path: ../purescript-hylograph-graph
    # Glassbox is being broken out into its own library; both packages resolve
    # to the sibling checkout until it is published.
    glassbox:
      path: ../purescript-glassbox/core
    glassbox-draw:
      path: ../purescript-glassbox/draw
    # Local, because the force-attractors demo needs the Rust kernel's forces
    # (towards, retarget, kineticEnergy), which are newer than the 0.6.0 that
    # package set 80.8.0 carries. The version there is still 0.6.0, so the
    # other demos' ranges hold.
    hylograph-simulation:
      path: ../purescript-hylograph-simulation
    # The simulation library's default kernel: d3-force's forces, and the
    # Rust kernel's, in PureScript. Unpublished, so it comes from the sibling
    # checkout, as hylograph-simulation above now requires.
    hylograph-forces:
      path: ../purescript-hylograph-forces
    # Local for the keyed-join fix the film "A join is a fold" found, which the
    # force-attractors demo re-renders through sixty times a second.
    hylograph-selection:
      path: ../purescript-hylograph-selection
    baskerville-core:
      path: ../../purescript-baskerville
    baskerville-sudoku:
      path: ../../purescript-baskerville/examples/sudoku
