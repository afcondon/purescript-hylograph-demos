workspace:
  packageSet:
    registry: 80.8.0
  extraPackages:
    # Not in any package set — unpublished. Built from the sibling checkout.
    hylograph-onion:
      path: ../purescript-hylograph-onion
    # Likewise unpublished: the layout-driven half of the chart library.
    hylograph-layout-components:
      path: ../purescript-hylograph-layout-components
    # Local, so it agrees with the hylograph-layout pinned below: layout 0.5.0
    # needs hylograph-graph >=0.3.1 (for `Data.Graph.InducedTree`), which is
    # exactly what this checkout is, so one consistent copy is in the build.
    # 0.3.1 is now published too, so this could become `hylograph-graph: "0.3.1"`.
    hylograph-graph:
      path: ../purescript-hylograph-graph
    # Glassbox is being broken out into its own library; both packages resolve
    # to the sibling checkout until it is published.
    glassbox:
      path: ../purescript-glassbox/core
    glassbox-draw:
      path: ../purescript-glassbox/draw
    # Published 2026-11-19 and not yet in package set 80.8.0, so pinned here.
    # Layout 0.5.0 carries `Transition extra` (state-machine) and d3-hierarchy
    # parity; simulation 1.0.0 the Rust kernel's forces (force-attractors);
    # simulation-halogen 0.6.0 drops hylograph-d3-kernel; forces 0.1.0 is the
    # simulation's default kernel; selection 0.6.0 has the keyed-join fix.
    hylograph-layout: "0.5.0"
    hylograph-simulation: "1.0.0"
    hylograph-simulation-halogen: "0.6.0"
    hylograph-forces: "0.1.0"
    hylograph-selection: "0.6.0"
    baskerville-core:
      path: ../../purescript-baskerville
    baskerville-sudoku:
      path: ../../purescript-baskerville/examples/sudoku
