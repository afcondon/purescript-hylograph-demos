package:
  name: hylograph-demo-baskerville-sudoku
  description: >
    Explainable Sudoku: purescript-baskerville proof DAGs laid out by hylograph-graph's
    Sugiyama and rendered with HATS. The completeness gap made visible — and the
    Régin tier closing it.
  dependencies:
    - aff: ">=8.0.0 <9.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - halogen: ">=7.0.0 <8.0.0"
    - hylograph-graph: ">=0.3.0 <0.4.0"
    - hylograph-selection: ">=0.5.1 <0.6.0"
    - integers: ">=6.0.0 <7.0.0"
    - baskerville-core: "*"
    - baskerville-sudoku: "*"
    - maybe: ">=6.0.0 <7.0.0"
    - numbers: ">=9.0.1 <10.0.0"
    - ordered-collections: ">=3.2.0 <4.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  bundle:
    module: Main
    outfile: "public/bundle.js"
    platform: browser
