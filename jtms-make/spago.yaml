package:
  name: hylograph-demo-jtms-make
  description: >
    make, deconstructed into "why" and "still?": a Makefile's semantics as
    monotone JTMS rules, staleness as derived belief with provenance, and the
    build DAG rendered as a Sankey projection of the derivation DAG.
  dependencies:
    - aff: ">=8.0.0 <9.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - console: ">=6.1.0 <7.0.0"
    - control: ">=6.0.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - halogen: ">=7.0.0 <8.0.0"
    - hylograph-graph: ">=0.3.0 <0.4.0"
    - hylograph-layout: ">=0.3.0 <0.4.0"
    - hylograph-selection: ">=0.5.1 <0.6.0"
    - integers: ">=6.0.0 <7.0.0"
    - jtms-core: "*"
    - maybe: ">=6.0.0 <7.0.0"
    - numbers: ">=9.0.1 <10.0.0"
    - ordered-collections: ">=3.2.0 <4.0.0"
    - parsing: ">=10.3.1 <11.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  test:
    main: Test.JtmsMake.Main
    dependencies:
      - exceptions
  bundle:
    module: Main
    outfile: "public/bundle.js"
    platform: browser
