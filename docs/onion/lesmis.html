<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hylograph-onion — Les Misérables (plotter style)</title>
  <link rel="stylesheet" href="lesmis.css">
</head>
<body>
  <header>
    <h1>Les Misérables</h1>
    <p class="subtitle">Character co-occurrence network — pen-plotter rendering</p>
  </header>
  <p id="webkit-note" hidden>
    In Safari, and in every browser on an iPhone or iPad, the watercolour
    washes on this page draw as rings of bands for now. Chrome on a computer draws them
    as intended.
  </p>
  <script>
    // The washes are stacked gradients at low opacity. Chrome dithers them;
    // WebKit does not, and the steps show as rings. Say so where it happens.
    if (/AppleWebKit/.test(navigator.userAgent) && !/Chrome\/|Chromium\/|Edg\//.test(navigator.userAgent)) document.getElementById('webkit-note').hidden = false;
  </script>
  <div id="lesmis-graph"></div>
  <details id="lesmis-code">
    <summary>Source</summary>
    <pre><code id="code-forces"></code></pre>
    <pre><code id="code-blobs"></code></pre>
    <pre><code id="code-render"></code></pre>
  </details>
  <script type="module" src="bundle.js"></script>
</body>
</html>
