<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explainable Sudoku — jtms × hylograph</title>
  <style>
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
           background: #fafafa; color: #111; max-width: 1440px;
           margin: 48px auto; padding: 0 24px; }
    h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
    p.sub { color: #666; font-size: 15px; margin: 8px 0 36px; max-width: 72ch; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em;
         color: #999; margin: 40px 0 12px; }
    .row { display: flex; gap: 48px; flex-wrap: wrap; align-items: flex-start; }
    .legend { font-size: 12px; color: #666; margin-top: 12px; }
    .legend span { display: inline-block; margin-right: 16px; }
    .legend i { display: inline-block; width: 10px; height: 10px;
                border-radius: 2px; margin-right: 6px; }
    .panel { background: #fff; border-radius: 8px; padding: 18px 24px 20px;
             box-shadow: 0 2px 14px rgba(0,0,0,0.09); }
    #dag-view svg { width: 100%; height: 720px; background: #fff;
                    border-radius: 8px; border: none !important;
                    box-shadow: 0 2px 14px rgba(0,0,0,0.09); }
    button { font: 12px 'Helvetica Neue', Helvetica, sans-serif; color: #333;
             background: #fff; border: 1px solid #ccc; border-radius: 4px;
             padding: 3px 10px; cursor: pointer; margin-left: 12px; }
    button:hover { border-color: #888; }
  </style>
</head>
<body>
  <script type="module" src="bundle.js"></script>
</body>
</html>
