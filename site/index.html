<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Library of Hylograph</title>
  <link rel="stylesheet" href="archipelago.css">
  <style>
    /* Gateway: the museum in plan. The Holy Tree grows out of the rotunda;
       three wings radiate; every room is a demo. */
    .plan {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }
    .plan text {
      font-family: 'Inter', sans-serif;
      text-anchor: middle;
      fill: #8a93a6;
    }
    .plan .roomlabel { font-size: 11.5px; font-weight: 600; letter-spacing: 0.12em; }
    .plan .wingname  { font-size: 15px;  font-weight: 700; letter-spacing: 0.22em; }
    .plan .wingname .g { fill: #1a1a1a; font-weight: 900; }
    .plan .annot     { font-size: 10px;  font-weight: 500; letter-spacing: 0.14em; fill: #a8aebc; }
    .plan .blocktext { font-size: 11px;  font-weight: 600; letter-spacing: 0.18em; fill: #4a5468; }
    .plan a { cursor: pointer; }
    .plan a .hit { fill: #5b7fa6; fill-opacity: 0; transition: fill-opacity 0.2s; }
    .plan a.e .hit { fill: #b5822f; }
    .plan a.s .hit { fill: #444444; }
    .plan a:hover .hit { fill-opacity: 0.09; }
    .plan a:hover text { fill: #1a1a1a; }
    .plan a:hover .frame { stroke-width: 3; }
  </style>
</head>
<body>

  <div class="scene">

    <div class="title">
      <h1><span class="over">The Library of</span>Hylograph</h1>
      <p class="sub">Interactive examples for the <a href="https://hylograph.net">Hylograph</a>
        visualization libraries and their neighbours.<br>Every room on the plan is a demo — step in.</p>
    </div>

    <svg class="plan" viewBox="0 0 1600 950" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="graph" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f2f0" stroke-width="1"/>
        </pattern>
        <filter id="plateshadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.22"/>
        </filter>
        <radialGradient id="treefadeg" cx="50%" cy="46%" r="54%">
          <stop offset="62%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#000000"/>
        </radialGradient>
        <mask id="treefade">
          <rect x="610" y="50" width="380" height="400" fill="url(#treefadeg)"/>
        </mask>
      </defs>

      <!-- drafting paper -->
      <rect x="0" y="0" width="1600" height="950" fill="url(#graph)"/>

      <!-- ══ Walls (poché ink #2f3d55) ══ -->
      <g fill="none" stroke="#2f3d55">

        <!-- rotunda -->
        <circle cx="800" cy="470" r="104" stroke-width="7"/>

        <!-- west wing: the Hylograph Wing -->
        <rect x="110" y="360" width="460" height="220" stroke-width="7"/>
        <!-- partitions with enfilade door gaps -->
        <path stroke-width="3" d="M 225 360 V 445 M 225 495 V 580
                                  M 340 360 V 445 M 340 495 V 580
                                  M 455 360 V 445 M 455 495 V 580"/>
        <!-- door swings -->
        <path stroke-width="1.1" d="M 225 445 a 50 50 0 0 1 50 50
                                    M 340 445 a 50 50 0 0 1 50 50
                                    M 455 445 a 50 50 0 0 1 50 50"/>
        <!-- corridor to rotunda -->
        <path stroke-width="4" d="M 570 445 H 700 M 570 495 H 700"/>

        <!-- east wing: the Scriptorium -->
        <rect x="1030" y="360" width="460" height="220" stroke-width="7"/>
        <path stroke-width="3" d="M 1145 360 V 445 M 1145 495 V 580
                                  M 1260 360 V 445 M 1260 495 V 580
                                  M 1375 360 V 445 M 1375 495 V 580"/>
        <path stroke-width="1.1" d="M 1145 495 a 50 50 0 0 0 -50 -50
                                    M 1260 495 a 50 50 0 0 0 -50 -50
                                    M 1375 495 a 50 50 0 0 0 -50 -50"/>
        <path stroke-width="4" d="M 900 445 H 1030 M 900 495 H 1030"/>

        <!-- south wing: the Reasoning Wing -->
        <rect x="640" y="690" width="320" height="200" stroke-width="7"/>
        <path stroke-width="3" d="M 746 690 V 765 M 746 815 V 890
                                  M 853 690 V 765 M 853 815 V 890"/>
        <path stroke-width="1.1" d="M 746 765 a 50 50 0 0 1 50 50
                                    M 853 765 a 50 50 0 0 1 50 50"/>
        <path stroke-width="4" d="M 775 570 V 690 M 825 570 V 690"/>
      </g>

      <!-- door openings: paper over wall segments -->
      <g fill="#ffffff">
        <rect x="565" y="444" width="10" height="52"/>   <!-- west wing entry -->
        <rect x="1025" y="444" width="10" height="52"/>  <!-- east wing entry -->
        <rect x="774" y="685" width="52" height="10"/>   <!-- south wing entry -->
        <rect x="693" y="443" width="12" height="54"/>   <!-- rotunda west door -->
        <rect x="895" y="443" width="12" height="54"/>   <!-- rotunda east door -->
        <rect x="773" y="566" width="54" height="12"/>   <!-- rotunda south door -->
      </g>

      <!-- ══ Rooms: every room is a demo ══ -->

      <!-- west wing, enfilade from the rotunda -->
      <a href="selection/">
        <rect class="hit" x="455" y="360" width="115" height="220"/>
        <text class="roomlabel" x="512" y="462"><tspan x="512">HYLOGRAPHIC</tspan><tspan x="512" dy="16">FOLD</tspan></text>
      </a>
      <a href="simulation/">
        <rect class="hit" x="340" y="360" width="115" height="220"/>
        <text class="roomlabel" x="397" y="462"><tspan x="397">FORCE</tspan><tspan x="397" dy="16">PLAYGROUND</tspan></text>
      </a>
      <a href="layout/">
        <rect class="hit" x="225" y="360" width="115" height="220"/>
        <text class="roomlabel" x="282" y="462"><tspan x="282">LAYOUT</tspan><tspan x="282" dy="16">GALLERY</tspan></text>
      </a>
      <a href="music/">
        <rect class="hit" x="110" y="360" width="115" height="220"/>
        <text class="roomlabel" x="167" y="462"><tspan x="167">ANSCOMBE'S</tspan><tspan x="167" dy="16">QUARTET</tspan></text>
      </a>

      <!-- east wing -->
      <a class="e" href="sigil/">
        <rect class="hit" x="1030" y="360" width="115" height="220"/>
        <text class="roomlabel" x="1087" y="470">SIGIL</text>
      </a>
      <a class="e" href="sigil-hats/">
        <rect class="hit" x="1145" y="360" width="115" height="220"/>
        <text class="roomlabel" x="1202" y="462"><tspan x="1202">TYPE</tspan><tspan x="1202" dy="16">CLASSES</tspan></text>
      </a>
      <a class="e" href="https://afcondon.github.io/elements-of-purescript-style/">
        <rect class="hit" x="1260" y="360" width="115" height="220"/>
        <text class="roomlabel" x="1317" y="462"><tspan x="1317">ELEMENTS</tspan><tspan x="1317" dy="16">OF STYLE &#8599;</tspan></text>
      </a>
      <a class="e" href="https://afcondon.github.io/the-prelude">
        <rect class="hit" x="1375" y="360" width="115" height="220"/>
        <text class="roomlabel" x="1432" y="462"><tspan x="1432">THE</tspan><tspan x="1432" dy="16">PRELUDE &#8599;</tspan></text>
      </a>

      <!-- south wing -->
      <a class="s" href="graph/">
        <rect class="hit" x="640" y="690" width="106" height="200"/>
        <text class="roomlabel" x="693" y="782"><tspan x="693">THE</tspan><tspan x="693" dy="16">HONEYCOMB</tspan></text>
      </a>
      <a class="s" href="graph-decomposition/">
        <rect class="hit" x="746" y="690" width="107" height="200"/>
        <text class="roomlabel" x="799" y="782"><tspan x="799">DECOMPO-</tspan><tspan x="799" dy="16">SITION</tspan></text>
      </a>
      <a class="s" href="jtms-sudoku/">
        <rect class="hit" x="853" y="690" width="107" height="200"/>
        <text class="roomlabel" x="906" y="782"><tspan x="906">EXPLAINABLE</tspan><tspan x="906" dy="16">SUDOKU</tspan></text>
      </a>

      <!-- rotunda label -->
      <text class="annot" x="800" y="548">ROTUNDA</text>

      <!-- ══ The woodcut plates, one over each wing ══ -->

      <a href="hylograph/">
        <text class="wingname" x="340" y="140" fill="#5b7fa6">DATA VISUALISATION &amp; <tspan class="g">GRAPH</tspan>ICS</text>
        <line x1="340" y1="318" x2="340" y2="358" stroke="#b8bfcc" stroke-width="1.5" stroke-dasharray="4 4"/>
        <g filter="url(#plateshadow)">
          <rect class="frame" x="261" y="157" width="158" height="158" fill="#ffffff" stroke="#5b7fa6" stroke-width="2"/>
          <image href="heroes/hylograph.jpg" x="265" y="161" width="150" height="150"/>
        </g>
      </a>

      <a href="scriptorium/">
        <text class="wingname" x="1260" y="140" fill="#b5822f">CODE TYPO<tspan class="g">GRAPH</tspan>Y AND STYLE</text>
        <line x1="1260" y1="318" x2="1260" y2="358" stroke="#b8bfcc" stroke-width="1.5" stroke-dasharray="4 4"/>
        <g filter="url(#plateshadow)">
          <rect class="frame" x="1181" y="157" width="158" height="158" fill="#ffffff" stroke="#b5822f" stroke-width="2"/>
          <image href="heroes/scriptorium.jpg" x="1185" y="161" width="150" height="150"/>
        </g>
      </a>

      <a href="reasoning/">
        <text class="wingname" x="1165" y="700" fill="#444444"><tspan class="g">GRAPH</tspan>S AND CHAINS OF REASON</text>
        <line x1="1085" y1="790" x2="962" y2="790" stroke="#b8bfcc" stroke-width="1.5" stroke-dasharray="4 4"/>
        <g filter="url(#plateshadow)">
          <rect class="frame" x="1086" y="711" width="158" height="158" fill="#ffffff" stroke="#444444" stroke-width="2"/>
          <image href="heroes/reasoning.jpg" x="1090" y="715" width="150" height="150"/>
        </g>
      </a>

      <!-- ══ The Holy Tree, grown out of the rotunda ══ -->
      <image href="tree-hero.jpg" x="620" y="60" width="360" height="360" mask="url(#treefade)"/>

      <!-- ══ Drafting furniture ══ -->

      <!-- north arrow -->
      <g stroke="#8a93a6" fill="none" stroke-width="1.5">
        <circle cx="1500" cy="110" r="26"/>
        <line x1="1500" y1="130" x2="1500" y2="96"/>
        <path d="M 1493 103 L 1500 90 L 1507 103" fill="#8a93a6" stroke="none"/>
      </g>
      <text class="annot" x="1500" y="160">N</text>

      <!-- scale bar -->
      <g>
        <rect x="120" y="878" width="45" height="7" fill="#2f3d55"/>
        <rect x="165" y="878" width="45" height="7" fill="none" stroke="#2f3d55" stroke-width="1.2"/>
        <rect x="210" y="878" width="45" height="7" fill="#2f3d55"/>
        <text class="annot" x="120" y="868" text-anchor="start">0</text>
        <text class="annot" x="255" y="868" text-anchor="end">30 M</text>
      </g>

      <!-- title block -->
      <g>
        <rect x="1250" y="806" width="310" height="116" fill="#ffffff" stroke="#2f3d55" stroke-width="2"/>
        <line x1="1250" y1="838" x2="1560" y2="838" stroke="#2f3d55" stroke-width="1"/>
        <line x1="1250" y1="868" x2="1560" y2="868" stroke="#2f3d55" stroke-width="1"/>
        <line x1="1250" y1="895" x2="1560" y2="895" stroke="#2f3d55" stroke-width="1"/>
        <text class="blocktext" x="1405" y="827">THE LIBRARY OF HYLOGRAPH</text>
        <text class="annot" x="1405" y="857">PLAN OF THE MUSEUM</text>
        <text class="annot" x="1405" y="884">DRAWING N&ordm; 1 &middot; SCALE 1:100 &middot; MMXXVI</text>
        <a href="https://github.com/afcondon/purescript-hylograph-demos"><text class="annot" x="1330" y="911">SOURCE &#8599;</text></a>
        <a href="https://hylograph.net"><text class="annot" x="1470" y="911">HYLOGRAPH.NET &#8599;</text></a>
      </g>
    </svg>

    <div class="foot-l">
      <b>Showcases</b>
      <span>&mdash; <a href="https://github.com/afcondon/purescript-hylograph-showcases">Tidal Radio</a>, <a href="https://github.com/afcondon/purescript-hylograph-showcases">Lorenz</a>, <a href="https://github.com/afcondon/purescript-hylograph-showcases">Sankey Editor</a>, <a href="https://github.com/afcondon/purescript-hylograph-showcases">more</a></span>
    </div>

  </div>

</body>
</html>
